<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyInclude Browser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assets/icons.css">
</head>
<body>
    <div id="app">
        <!-- Tab Strip -->
        <div id="tab-strip">
            <div id="tabs-container">
                <!-- Tabs will be dynamically added here -->
            </div>
            <button id="new-tab-btn" class="new-tab-button" title="New Tab">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Navigation Bar -->
        <div id="nav-bar">
            <div class="nav-controls">
                <button id="back-btn" class="nav-button" disabled title="Go Back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button id="forward-btn" class="nav-button" disabled title="Go Forward">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button id="reload-btn" class="nav-button" title="Reload">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>

            <div class="address-bar-container">
                <div id="security-indicator" class="security-indicator">
                    <i class="fas fa-lock"></i>
                </div>
                <input type="text" id="address-bar" class="address-bar" placeholder="Enter URL or search term...">
                <div id="loading-indicator" class="loading-indicator">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>

            <div class="nav-controls">
                <button id="hns-test-btn" class="nav-button" title="HNS Resolver Test">
                    <i class="fas fa-network-wired"></i>
                </button>
                <button id="menu-btn" class="nav-button" title="Menu">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar hidden">
            <span id="status-text"></span>
            <button id="close-status" class="close-status">×</button>
        </div>

        <!-- Content Area (BrowserView will be placed here) -->
        <div id="content-area">
            <!-- BrowserView content will be rendered here -->
        </div>

        <!-- Modals -->
        <!-- HNS Resolver Test Modal -->
        <div id="hns-test-modal" class="modal hidden">
            <div class="modal-content hns-test-modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-network-wired"></i> HNS Resolver Test</h3>
                    <button class="close-modal" data-modal="hns-test-modal">×</button>
                </div>
                <div class="modal-body">
                    <div class="hns-test-form">
                        <div class="form-group">
                            <label for="test-domain">Domain Name (QNAME)</label>
                            <input type="text" id="test-domain" class="form-input" placeholder="setup.skyinclude" value="">
                        </div>
                        
                        <div class="form-group">
                            <label for="test-resolver">DNS Server Host/IP/DoH URI</label>
                            <input type="text" id="test-resolver" class="form-input" placeholder="https://hnsdoh.com/dns-query" value="">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="test-protocol">Protocol/Port</label>
                                <select id="test-protocol" class="form-select">
                                    <option value="DoH">DoH (from URI)</option>
                                    <option value="DNS">DNS (Port 53)</option>
                                    <option value="DoT">DoT (Port 853)</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="test-qtype">QTYPE/CLASS</label>
                                <div class="qtype-row">
                                    <select id="test-qtype" class="form-select">
                                        <option value="A">A</option>
                                        <option value="AAAA">AAAA</option>
                                        <option value="CNAME">CNAME</option>
                                        <option value="TXT">TXT</option>
                                        <option value="NS">NS</option>
                                        <option value="MX">MX</option>
                                    </select>
                                    <input type="number" id="test-ttl" class="form-input-small" value="1" min="1">
                                    <select id="test-class" class="form-select">
                                        <option value="IN">IN</option>
                                        <option value="CH">CH</option>
                                        <option value="HS">HS</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Options</label>
                            <div class="checkbox-row">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="test-rd" checked> RD
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="test-cd"> CD
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="test-do" checked> DO
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="test-tcp"> TCP
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="test-dnssec"> Local DNSSEC validation
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button id="query-btn" class="query-btn">
                                <i class="fas fa-search"></i> QUERY
                            </button>
                            <button id="clear-btn" class="clear-btn">
                                <i class="fas fa-broom"></i> CLEAR
                            </button>
                        </div>
                        
                        <div id="test-results" class="test-results">
                            <div class="result-header">
                                <div class="result-status">
                                    Status: <span id="result-status">Ready</span>
                                </div>
                                <div class="result-timing">
                                    <span id="result-time">0 ms</span> 
                                    <span id="result-rcode">NOQUERY</span>
                                    <span id="result-size">0</span>
                                    <span id="result-asize">0</span>
                                </div>
                            </div>
                            
                            <div class="result-flags">
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-aa" disabled> AA
                                </label>
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-tc" disabled> TC
                                </label>
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-rd" disabled> RD
                                </label>
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-ra" disabled> RA
                                </label>
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-ad" disabled> AD
                                </label>
                                <label class="flag-label">
                                    <input type="checkbox" id="flag-cd" disabled> CD
                                </label>
                            </div>
                            
                            <div class="result-sections">
                                <div class="result-section">
                                    <h4>ANSWER SECTION:</h4>
                                    <div id="answer-section" class="dns-records">
                                        <!-- Answer records will be displayed here -->
                                    </div>
                                </div>
                                
                                <div class="result-section">
                                    <h4>AUTHORITY SECTION:</h4>
                                    <div id="authority-section" class="dns-records">
                                        <!-- Authority records will be displayed here -->
                                    </div>
                                </div>
                                
                                <div class="result-section">
                                    <h4>ADDITIONAL SECTION:</h4>
                                    <div id="additional-section" class="dns-records">
                                        <!-- Additional records will be displayed here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="history-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Browsing History</h3>
                    <button class="close-modal" data-modal="history-modal">×</button>
                </div>
                <div class="modal-body">
                    <div id="history-list">
                        <!-- History items will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="close-modal" data-modal="settings-modal">×</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h4>HNS Resolution</h4>
                        <label class="setting-item">
                            <input type="radio" name="hns-mode" value="doh" checked>
                            DNS-over-HTTPS (recommended)
                        </label>
                        <label class="setting-item">
                            <input type="radio" name="hns-mode" value="p2p">
                            P2P Light Client (more private)
                        </label>
                    </div>
                    
                    <div class="settings-section">
                        <h4>Privacy</h4>
                        <label class="setting-item">
                            <input type="checkbox" id="block-trackers" checked>
                            Block tracking scripts
                        </label>
                        <label class="setting-item">
                            <input type="checkbox" id="disable-javascript" checked>
                            Enable JavaScript
                        </label>
                    </div>
                    
                    <div class="settings-section">
                        <h4>Security</h4>
                        <label class="setting-item">
                            <input type="checkbox" id="strict-ssl" checked>
                            Strict SSL verification
                        </label>
                        <label class="setting-item">
                            <input type="checkbox" id="hns-dane" checked>
                            Enable DANE for HNS domains
                        </label>
                    </div>

                    <div class="settings-actions">
                        <button id="save-settings" class="primary-button">Save Settings</button>
                        <button id="reset-settings" class="secondary-button">Reset to Defaults</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="dropdown hidden">
            <div class="dropdown-item" data-action="new-tab">
                <i class="fas fa-plus"></i> New Tab
            </div>
            <div class="dropdown-item" data-action="history">
                <i class="fas fa-history"></i> History
            </div>
            <div class="dropdown-item" data-action="settings">
                <i class="fas fa-cog"></i> Settings
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="dev-tools">
                <i class="fas fa-code"></i> Developer Tools
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="about">
                <i class="fas fa-info-circle"></i> About SkyInclude
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
