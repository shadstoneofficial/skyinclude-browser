<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyInclude Browser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assets/icons.css">
</head>
<body>
    <div id="app">
        <!-- Tab Strip -->
        <div id="tab-strip">
            <div id="tabs-container">
                <!-- Tabs will be dynamically added here -->
            </div>
            <button id="new-tab-btn" class="new-tab-button" title="New Tab">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Navigation Bar -->
        <div id="nav-bar">
            <div class="nav-controls">
                <button id="back-btn" class="nav-button" disabled title="Go Back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button id="forward-btn" class="nav-button" disabled title="Go Forward">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button id="reload-btn" class="nav-button" title="Reload">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>

            <div class="address-bar-container">
                <div id="security-indicator" class="security-indicator">
                    <i class="fas fa-lock"></i>
                </div>
                <div id="hosting-indicator" class="hosting-indicator hidden" title="Hosted on GitHub Pages; this is not a security indicator" role="img" aria-label="Hosted on GitHub Pages">
                    <i class="fas fa-github"></i>
                    <span>Pages</span>
                </div>
                <button id="hns-profile-btn" class="hns-profile-button hidden" title="View profile records" aria-label="View profile records">
                    <span aria-hidden="true">🪪</span>
                </button>
                <input type="text" id="address-bar" class="address-bar" placeholder="Enter URL or search term...">
                <div id="loading-indicator" class="loading-indicator">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>

            <div class="nav-controls">
                <button id="clear-cache-btn" class="nav-button" title="Refresh HNS cache and reload">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="update-btn" class="nav-button" title="Check for updates">
                    <i class="fas fa-download"></i>
                </button>
                <span id="app-version-badge" class="version-badge" title="SkyInclude Browser version"></span>
                <button id="menu-btn" class="nav-button" title="Menu">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar hidden">
            <span id="status-text"></span>
            <button id="close-status" class="close-status">×</button>
        </div>

        <!-- Content Area (BrowserView will be placed here) -->
        <div id="content-area">
            <!-- BrowserView content will be rendered here -->
        </div>

        <div id="hns-profile-popover" class="hns-profile-popover hidden" role="dialog" aria-label="hns.bio profile records">
            <div class="hns-profile-header">
                <div>
                    <div class="hns-profile-kicker">hns.bio</div>
                    <div id="hns-profile-domain" class="hns-profile-domain"></div>
                </div>
                <button id="close-hns-profile" class="close-profile" title="Close profile records">×</button>
            </div>
            <div id="hns-profile-list" class="hns-profile-list"></div>
        </div>

        <!-- Modals -->

        <div id="history-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Browsing History</h3>
                    <button class="close-modal" data-modal="history-modal">×</button>
                </div>
                <div class="modal-body">
                    <div id="history-list">
                        <!-- History items will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="close-modal" data-modal="settings-modal">×</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h4>HNS Resolution</h4>
                        <label class="setting-item">
                            <input type="radio" name="hns-mode" value="doh" checked>
                            DNS-over-HTTPS (recommended)
                        </label>
                        <label class="setting-item">
                            <input type="radio" name="hns-mode" value="p2p">
                            P2P Light Client (more private)
                        </label>
                    </div>
                    
                    <div class="settings-section">
                        <h4>Privacy</h4>
                        <label class="setting-item">
                            <input type="checkbox" id="block-trackers" checked>
                            Block tracking scripts
                        </label>
                        <label class="setting-item">
                            <input type="checkbox" id="disable-javascript" checked>
                            Enable JavaScript
                        </label>
                    </div>
                    
                    <div class="settings-section">
                        <h4>Security</h4>
                        <label class="setting-item">
                            <input type="checkbox" id="strict-ssl" checked>
                            Strict SSL verification
                        </label>
                    </div>

                    <div class="settings-actions">
                        <button id="save-settings" class="primary-button">Save Settings</button>
                        <button id="reset-settings" class="secondary-button">Reset to Defaults</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="dropdown hidden">
            <div class="dropdown-version">
                <span>SkyInclude Browser</span>
                <span id="menu-version-label"></span>
            </div>
            <div class="dropdown-item" data-action="updates">
                <i class="fas fa-download"></i> Check for Updates
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="new-tab">
                <i class="fas fa-plus"></i> New Tab
            </div>
            <div class="dropdown-item" data-action="history">
                <i class="fas fa-history"></i> History
            </div>
            <div class="dropdown-item" data-action="settings">
                <i class="fas fa-cog"></i> Settings
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="dev-tools">
                <i class="fas fa-code"></i> Developer Tools
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="about">
                <i class="fas fa-info-circle"></i> About SkyInclude
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
